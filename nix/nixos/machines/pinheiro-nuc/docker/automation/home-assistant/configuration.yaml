# Loads default set of integrations. Do not remove.
default_config:

homeassistant:
  packages: !include_dir_named packages

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include automations.yaml
script: !include scripts.yaml
scene: !include scenes.yaml

# AC units are provided by the vendored `ar_smart_ir` custom component
# (custom_components/ar_smart_ir). Unlike the old `smartir` component it is
# config-flow / UI only and cannot be configured in YAML, so the 6 AC units
# are set up via the HA UI. Reference for re-creating them (all use
# device_code 5120, Broadlink/remote controller = remote.<room>_ir_remote):
#   Office AC        -> remote.office_ir_remote
#   Guestroom AC     -> remote.guestroom_ir_remote
#   Livingroom AC    -> remote.livingroom_ir_remote
#   Kids room AC     -> remote.kids_room_ir_remote
#   Master bedroom AC-> remote.master_bedroom_ir_remote
#   Kitchen AC       -> remote.kitchen_ir_remote
