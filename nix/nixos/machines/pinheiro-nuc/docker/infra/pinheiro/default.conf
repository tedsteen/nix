server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location ~ ^/traefik/?(.*)$ {
        return 302 http://pinheiro-nuc:18081/$1$is_args$args;
    }

    location ~ ^/influxdb/?(.*)$ {
        return 302 http://pinheiro-nuc:18086/$1$is_args$args;
    }

    location ~ ^/grafana/?(.*)$ {
        return 302 http://pinheiro-nuc:13000/$1$is_args$args;
    }

    location ~ ^/home-assistant/?(.*)$ {
        return 302 http://pinheiro-nuc:18123/$1$is_args$args;
    }

    location ~ ^/nodered/?(.*)$ {
        return 302 http://pinheiro-nuc:11880/$1$is_args$args;
    }

    location ~ ^/prowlarr/?(.*)$ {
        return 302 http://pinheiro-nuc:19696/$1$is_args$args;
    }

    location ~ ^/ombi/?(.*)$ {
        return 302 http://pinheiro-nuc:13579/$1$is_args$args;
    }

    location ~ ^/radarr/?(.*)$ {
        return 302 http://pinheiro-nuc:17878/$1$is_args$args;
    }

    location ~ ^/bazarr/?(.*)$ {
        return 302 http://pinheiro-nuc:16767/$1$is_args$args;
    }

    location ~ ^/sonarr/?(.*)$ {
        return 302 http://pinheiro-nuc:18989/$1$is_args$args;
    }

    location = /transmission {
        return 302 http://pinheiro-nuc:19091/transmission/web/;
    }

    location ~ ^/transmission/(.*)$ {
        return 302 http://pinheiro-nuc:19091/transmission/$1$is_args$args;
    }

    location = /tedflix {
        return 302 http://pinheiro-nuc:32400/web/;
    }

    location ~ ^/tedflix/(.*)$ {
        return 302 http://pinheiro-nuc:32400/$1$is_args$args;
    }

    location ~ ^/whoami/?(.*)$ {
        return 302 http://pinheiro-nuc:18082/$1$is_args$args;
    }

    location = /cors-proxy {
        return 302 http://pinheiro-nuc:18083/;
    }

    location ~ ^/cors-proxy/(.*)$ {
        return 302 http://pinheiro-nuc:18083/$1$is_args$args;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
