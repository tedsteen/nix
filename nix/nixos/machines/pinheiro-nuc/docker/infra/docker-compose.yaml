services:
  ddns-pinheiro:
    image: favonia/cloudflare-ddns
    user: "1000" # User ted has read access to the secret
    restart: always
    read_only: true
    cap_drop: [all]
    security_opt: [no-new-privileges:true]
    environment:
      - TZ=Europe/Lisbon
      - CLOUDFLARE_API_TOKEN_FILE=/run/secrets/cloudflare_s3n_io_ddns_api_token
      - DOMAINS=ddns.pinheiro.s3n.io
      - PROXIED=true
      - IP6_PROVIDER=none
    secrets:
      - cloudflare_s3n_io_ddns_api_token

  site-pinheiro:
    build: pinheiro
    restart: unless-stopped
    ports:
      - '127.0.0.1:18080:80'
  
  traefik:
    image: 'traefik:latest'
    restart: unless-stopped
    pull_policy: always
    command:
      #- '--log.level=DEBUG'
      - '--api.insecure=true'
      - '--providers.docker=true'
      - '--providers.docker.exposedbydefault=false'

      # Public entrypoint — Cloudflare terminates TLS and connects to origin over HTTP
      - '--entryPoints.web_public.address=:1080'
    ports:
      - '1080:1080'
      - '127.0.0.1:18081:8080'
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - traefik

  influxdb:
    image: influxdb:alpine
    restart: unless-stopped
    pull_policy: always
    healthcheck:
      test: "curl -f http://localhost:8086/ping"
      interval: 2s
      timeout: 10s
      retries: 5
    environment:
      TZ: Europe/Lisbon
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ted
      DOCKER_INFLUXDB_INIT_PASSWORD: password
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: MyInitialAdminToken0==
      DOCKER_INFLUXDB_INIT_ORG: pinheiro
      DOCKER_INFLUXDB_INIT_BUCKET: everything
    ports:
      - '127.0.0.1:18086:8086'
    networks:
      - metrics
    volumes:
      - influxdb_data:/var/lib/influxdb2
      - influxdb_config:/etc/influxdb2

  grafana:
    image: grafana/grafana:latest
    restart: unless-stopped
    pull_policy: always
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      - GF_AUTH_DISABLE_LOGIN_FORM=true
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Admin
      - GF_SECURITY_ALLOW_EMBEDDING=true
    ports:
      - '127.0.0.1:13000:3000'
    networks:
      - metrics
    volumes:
      - grafana:/var/lib/grafana

  telegraf:
    build: ./telegraf
    restart: unless-stopped
    privileged: true
    hostname: "pinheiro-nuc"
    depends_on:
      influxdb:
        condition: service_healthy
    environment:
      TZ: Europe/Lisbon
      INFLUXDB_ADMIN_TOKEN: MyInitialAdminToken0==
      HOST_MOUNT_PREFIX: /hostfs
      HOST_ETC: /hostfs/etc
      HOST_PROC: /hostfs/proc
      HOST_SYS: /hostfs/sys
      HOST_VAR: /hostfs/var
      HOST_RUN: /hostfs/run
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /run/udev:/run/udev:ro
      - /:/hostfs:ro
    networks:
      - metrics
  
  samba:
    image: dperson/samba
    pull_policy: always
    command: -n -r -s "Everything;/mount;yes;no;yes;;;;"
    restart: unless-stopped
    ports:
      - "139:139"
      - "445:445"
    volumes:
      - /:/mount
    environment:
      GROUPID: 0
      USERID: 0
      TZ: Europe/Lisbon
    tmpfs:
      - /tmp

  wireguard:
    build: ./wireguard
    restart: unless-stopped
    healthcheck:
      test: curl https://am.i.mullvad.net/connected | grep -q "You are connected"
      interval: 5s
      start_period: 5s
      start_interval: 2s
      retries: 3
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    volumes:
      - ${INFRA_WIREGUARD_CONFIG}:/etc/wireguard/wg0.conf
    dns:
      - 10.64.0.1 # NOTE!! This can't be in the wg0.conf because docker owns the resolv.conf and openresolv will clash with it, so instead we comment out the DNS part of the wg0.conf and put it here...
    networks:
      wireguard:
        ipv4_address: 172.40.0.2

networks:
  traefik:
    driver: bridge
  metrics:
    driver: bridge
  wireguard:
    driver: bridge
    ipam:
      config:
      - subnet: 172.40.0.0/29

volumes:
  influxdb_data:
  influxdb_config:
  grafana:

secrets:
  cloudflare_s3n_io_ddns_api_token:
    file: /run/secrets/cloudflare_s3n_io_ddns_api_token
